name: e-CROSS
description: >-
  e-CROSS is a cross-border e-commerce platform that lets international brands sell into
  Latin America. Acting as a Merchant of Record, it handles payment processing, currency
  exchange, logistics and fulfillment intelligence, customs and legal compliance, and
  storefront localization so merchants can expand into the region with a simple integration
  into their existing e-commerce stack. e-CROSS is a 500 Global portfolio company. Its
  public site runs on Wix and exposes a hosted, unauthenticated Model Context Protocol
  (MCP) server plus an llms.txt for agentic AI access to public site content; e-CROSS does
  not currently publish a first-party developer API, OpenAPI, or SDK.
